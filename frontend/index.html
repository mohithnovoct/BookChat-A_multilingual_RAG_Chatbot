<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookChat — Talk to Your Books</title>
  <meta name="description" content="Upload books and documents, then ask questions about them using AI-powered retrieval." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header id="app-header">
    <div class="header-left">
      <span class="logo-icon">📖</span>
      <h1>BookChat</h1>
    </div>
    <div class="header-right">
      <span id="health-indicator" class="health-dot" title="Checking API..."></span>
      <span id="health-label" class="health-label">Connecting…</span>
      <button id="btn-reset" class="btn-ghost" title="Clear all documents">Reset Store</button>
    </div>
  </header>

  <!-- Main -->
  <main id="app-main">

    <!-- Left: Upload Panel -->
    <section id="upload-panel" class="panel">
      <h2>Documents</h2>
      <div
        id="drop-zone"
        class="drop-zone"
        tabindex="0"
        role="button"
        aria-label="Upload files"
      >
        <div class="drop-zone-content">
          <span class="drop-icon">⬆</span>
          <p>Drop files here or <span class="browse-link">browse</span></p>
          <p class="drop-hint">PDF, TXT, MD — up to 50 MB each</p>
        </div>
        <input
          type="file"
          id="file-input"
          multiple
          accept=".pdf,.txt,.md"
          hidden
        />
      </div>
      <div id="file-list" class="file-list" aria-live="polite"></div>
      <button id="btn-upload" class="btn-primary" disabled>Upload &amp; Ingest</button>
      <div id="upload-status" class="status-message" aria-live="polite"></div>
    </section>

    <!-- Right: Chat Panel -->
    <section id="chat-panel" class="panel">
      <h2>Ask a Question</h2>
      <div id="chat-messages" class="chat-messages">
        <div class="empty-state">
          <span class="empty-icon">💬</span>
          <p>Upload a document and start asking questions</p>
        </div>
      </div>
      <form id="query-form" class="query-bar">
        <input
          type="text"
          id="query-input"
          placeholder="Ask something about your documents…"
          autocomplete="off"
          required
        />
        <button type="submit" id="btn-send" class="btn-send" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </section>

  </main>

  <!-- Confirmation Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <h3 id="modal-title">Reset Vector Store</h3>
      <p>This will permanently delete all ingested documents. Are you sure?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-ghost">Cancel</button>
        <button id="modal-confirm" class="btn-danger">Reset</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
