[project]
name = "bookchat"
version = "0.1.0"
description = "RAG API for chatting with your books and documents"
readme = "README.md"
authors = [
    { name = "Mohith Butta", email = "mohithbutta4002@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "llama-index-llms-huggingface>=0.3.0",
    "qdrant-client>=1.11.0",
    "pypdf>=6.15.0",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0.0",
    "llama-index-retrievers-bm25>=0.5.0",
]

[project.scripts]
bookchat = "bookchat:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
