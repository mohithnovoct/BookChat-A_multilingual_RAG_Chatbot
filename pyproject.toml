[project]
name = "bookchat"
version = "0.1.0"
description = "RAG API for chatting with your books and documents"
readme = "README.md"
authors = [
    { name = "Mohith Butta", email = "mohithbutta4002@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.15.0",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "langchain-experimental>=0.4.2",
]

[project.scripts]
bookchat = "bookchat:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
